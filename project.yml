name: English30
options:
  bundleIdPrefix: com.yatokmcsvg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  English30:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/App
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: English 30
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - english30
        UILaunchScreen: {}
    dependencies:
      - target: English30Widget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yatokmcsvg.English30
        TARGETED_DEVICE_FAMILY: "1,2"
  English30Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/Widget
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: English 30 Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yatokmcsvg.English30.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
